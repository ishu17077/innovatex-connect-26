<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Welcome to InnovateX Connect '26</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f8fafc; color: #1e293b; padding: 20px; }
    .card { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 16px; border: 1px solid #e2e8f0; }
    .badge { display: inline-block; background: #e0e7ff; color: #3730a3; font-weight: bold; padding: 4px 12px; border-radius: 9999px; font-size: 12px; }
    .btn { display: inline-block; background: #1e1b4b; color: #ffffff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Welcome</span>
    <h2>Welcome to InnovateX Connect '26!</h2>
    <p>Hi {{name}},</p>
    <p>Thank you for registering. You can now log into your dashboard and book your ticket for the 8-hour meetup event in Kolkata.</p>
    <a href="{{dashboardUrl}}" class="btn">Go to Dashboard</a>
  </div>
</body>
</html>
